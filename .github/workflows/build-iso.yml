name: Build ISO

on:
  push:
    tags:
      - "v*"
  pull_request:
    paths:
      - "build/**"
      - "overlay/**"
      - "src/**"
      - ".github/workflows/build-iso.yml"
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: alpine:3.20   # pin explicitly — reproducibility matters for a diagnostic tool
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          apk add --no-cache alpine-sdk alpine-conf syslinux xorriso squashfs-tools \
            docker git bash

      - name: Build ISO
        run: |
          chmod +x build/build.sh
          ./build/build.sh

      - name: Checksum
        run: |
          sha256sum out/linktest-os.iso > out/linktest-os.iso.sha256

      - name: Upload build artifact (PR / manual runs)
        if: github.event_name != 'push'
        uses: actions/upload-artifact@v4
        with:
          name: linktest-os-iso
          path: out/

      - name: Publish release (tag pushes only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/linktest-os.iso
            out/linktest-os.iso.sha256
